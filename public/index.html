<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Registro - CRUD Excel</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">

        <!-- Cabecera (se carga dinámicamente) -->
        <div id="header-placeholder"></div>

        <!-- Mensajes -->
        <div id="mensaje" class="mensaje"></div>

        <!-- Formulario CRUD -->
        <section class="card">
            <h2>➕ <span id="tituloFormulario">Agregar Nuevo Registro</span></h2>
            <form id="formulario">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" id="nombre" required>
                    </div>
                    <div class="form-group">
                        <label>Apellido</label>
                        <input type="text" id="apellido" required>
                    </div>
                    <div class="form-group">
                        <label>Edad</label>
                        <input type="number" id="edad" min="0" max="120" required>
                    </div>
                    <div class="form-group">
                        <label>Fecha Nacimiento</label>
                        <input type="date" id="fechaNacimiento" required>
                    </div>
                    <div class="form-group">
                        <label>DNI</label>
                        <input type="text" id="dni" maxlength="8" required>
                    </div>
                    <div class="form-group">
                        <label>Celular</label>
                        <input type="text" id="celular" maxlength="9" required>
                    </div>
                    <div class="form-group">
                        <label>Ciudad</label>
                        <input type="text" id="ciudad" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-success" id="btnGuardar">
                        💾 Guardar
                    </button>
                    <button type="button" class="btn btn-secondary" id="btnCancelar" style="display:none;">
                        ❌ Cancelar Edición
                    </button>
                </div>
            </form>
        </section>

        <!-- Filtros + Tabla -->
        <section class="card">
            <h2>📋 Lista de Registros <span class="badge" id="contador">0</span></h2>

            <div class="filters">
                <input type="text" id="filtroNombre" placeholder="🔍 Filtrar por nombre...">
                <input type="text" id="filtroDNI" placeholder="🔍 Filtrar por DNI...">
                <input type="number" id="filtroEdad" placeholder="🔍 Filtrar por edad...">
                <input type="text" id="filtroCiudad" placeholder="🔍 Filtrar por ciudad...">
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Edad</th>
                            <th>Fecha Nac.</th>
                            <th>DNI</th>
                            <th>Celular</th>
                            <th>Ciudad</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaDatos"></tbody>
                </table>
            </div>
        </section>

        <!-- Footer (se carga dinámicamente) -->
        <div id="footer-placeholder"></div>
    </div>

    <!-- Punto de entrada del sistema modular -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
